replicaCount: 3

image:
  repository: ghcr.io/example/web-api
  tag: "1.2.3"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: web-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/web-api

containerPort: 8080

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

livenessProbe:
  httpGet: { path: /healthz, port: 8080 }
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet: { path: /readyz, port: 8080 }
  initialDelaySeconds: 5
  periodSeconds: 10

podDisruptionBudget:
  maxUnavailable: 1

networkPolicy:
  enabled: true
  # allow ingress from the ingress controller + monitoring
  ingressNamespaces:
    - ingress-nginx
    - monitoring
